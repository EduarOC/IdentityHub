services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identityhub
      POSTGRES_USER: identityhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copiar .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identityhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    # En Render, la base de datos vive como un servicio administrado aparte (no cuenta contra
    # el límite de RAM de un web service). Este límite local es solo para desarrollo cómodo.
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en .env (copiar .env.example)}
      # El realm las lee al importarse: secret del cliente auth-proxy y clave de ana.torres.
      PROXY_CLIENT_SECRET: ${PROXY_CLIENT_SECRET:?Falta PROXY_CLIENT_SECRET en .env (copiar .env.example)}
      UAT_USER_PASSWORD: ${UAT_USER_PASSWORD:?Falta UAT_USER_PASSWORD en .env (copiar .env.example)}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identityhub
      KC_DB_USERNAME: identityhub
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copiar .env.example)}
      # Desde Keycloak 24, el heap de la JVM se calcula automáticamente como un porcentaje
      # de la memoria del contenedor (por defecto ~70%). Por eso el límite de memoria del
      # contenedor (mem_limit, abajo) es lo que realmente controla cuánto heap toma Keycloak
      # — sin ese límite, Keycloak puede asumir la memoria completa del host y sobrepasar
      # los 512 MB gratuitos de Render. Además, se fija un heap explícito conservador como
      # margen de seguridad extra (dejando espacio para metaspace y memoria nativa).
      JAVA_OPTS_APPEND: "-Xms128m -Xmx250m -XX:MaxMetaspaceSize=150m"
    volumes:
      # --import-realm carga automáticamente el realm, el cliente del auth-proxy y un usuario
      # de prueba (ana.torres, con la clave UAT_USER_PASSWORD de .env) al arrancar. Nada que configurar a mano para
      # probar el flujo de login por primera vez.
      - ./keycloak-realm:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Simula el límite real del plan gratuito de Render (512 MB por servicio web).
    # Probar localmente con este límite ANTES de desplegar evita sorpresas de memoria en producción.
    mem_limit: 512m

  inventory-service:
    build: ./inventory-service
    environment:
      DATABASE_URL: postgresql://identityhub:${POSTGRES_PASSWORD}@postgres:5432/identityhub
      KEYCLOAK_URL: http://keycloak:8080
      # Con esta clave definida, el inventario solo responde a inventory-proxy (cuenta de servicio).
      BACKEND_SERVICE_USER: svc-inventario
      BACKEND_SERVICE_PASSWORD: ${INVENTORY_SERVICE_PASSWORD:?Falta INVENTORY_SERVICE_PASSWORD en .env (copiar .env.example)}
      # Cifra los secretos de los conectores guardados en la base.
      CONECTORES_CLAVE: ${CONECTORES_CLAVE:?Falta CONECTORES_CLAVE en .env (copiar .env.example)}
    # El panel se abre por inventory-proxy en http://localhost:9100. El puerto 5000 queda solo
    # en esta máquina para el conector de Entra ID, que entra con la cuenta de servicio.
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    # Flask + SQLAlchemy es liviano; 512 MB le sobra, pero se deja el mismo límite que Render
    # para que las pruebas locales reflejen fielmente el ambiente real de despliegue.
    mem_limit: 512m

  legacy-app-demo:
    build: ./legacy-app-demo
    environment:
      BACKEND_SERVICE_USER: service-account
      BACKEND_SERVICE_PASSWORD: ${BACKEND_SERVICE_PASSWORD:?Falta BACKEND_SERVICE_PASSWORD en .env (copiar .env.example)}
    ports:
      - "6000:6000"
    mem_limit: 256m

  auth-proxy:
    build: ./auth-proxy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: identityhub
      PROXY_CLIENT_ID: auth-proxy
      PROXY_CLIENT_SECRET: ${PROXY_CLIENT_SECRET:?Falta PROXY_CLIENT_SECRET en .env (copiar .env.example)}
      BACKEND_URL: http://legacy-app-demo:6000
      BACKEND_SERVICE_USER: service-account
      BACKEND_SERVICE_PASSWORD: ${BACKEND_SERVICE_PASSWORD:?Falta BACKEND_SERVICE_PASSWORD en .env (copiar .env.example)}
    ports:
      - "9000:9000"
    depends_on:
      - keycloak
      - legacy-app-demo
    mem_limit: 256m

  # Segunda instancia del mismo auth-proxy, delante del inventario: login con Keycloak y solo
  # usuarios con el rol admin-ti. Panel en http://localhost:9100.
  inventory-proxy:
    build: ./auth-proxy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: identityhub
      PROXY_CLIENT_ID: auth-proxy
      PROXY_CLIENT_SECRET: ${PROXY_CLIENT_SECRET:?Falta PROXY_CLIENT_SECRET en .env (copiar .env.example)}
      PROXY_REQUIRED_ROLE: admin-ti
      PORT: "9100"
      BACKEND_URL: http://inventory-service:5000
      BACKEND_SERVICE_USER: svc-inventario
      BACKEND_SERVICE_PASSWORD: ${INVENTORY_SERVICE_PASSWORD:?Falta INVENTORY_SERVICE_PASSWORD en .env (copiar .env.example)}
    ports:
      - "9100:9100"
    depends_on:
      - keycloak
      - inventory-service
    mem_limit: 256m

volumes:
  postgres_data:
