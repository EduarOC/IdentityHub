# Blueprint de Render (Infraestructura como Código) para IdentityHub.
# Despliegue: Render → New → Blueprint → repositorio EduarOC/IdentityHub → rama main.
# Guía paso a paso: docs/DESPLIEGUE_RENDER.md.
#
# URLs públicas: Render asigna https://<nombre-del-servicio>.onrender.com. Si al crear un
# servicio Render le agrega un sufijo (porque el nombre ya existe), actualizar las URLs de este
# archivo y de keycloak-realm/identityhub-realm.json.
#
# La región no se puede cambiar después de crear un servicio: todo va en Virginia,
# la más cercana a Colombia.
#
# Secretos: ninguno escrito aquí. Render genera los compartidos (generateValue) y pide a mano
# los que debe elegir una persona (sync: false).

envVarGroups:
  # Secret del cliente OIDC "auth-proxy". Keycloak lo toma al importar el realm y los dos
  # proxies lo usan para canjear el código de login: Render lo genera una vez y lo comparten.
  - name: identityhub-cliente-oidc
    envVars:
      - key: PROXY_CLIENT_SECRET
        generateValue: true
  # Credencial con la que el gateway entra al aplicativo legacy.
  - name: identityhub-cuenta-servicio
    envVars:
      - key: BACKEND_SERVICE_USER
        value: svc-identityhub
      - key: BACKEND_SERVICE_PASSWORD
        generateValue: true
  # Credencial con la que el panel entra al inventario. Es distinta de la del legacy:
  # si una se filtra, la otra sigue protegida.
  - name: identityhub-cuenta-inventario
    envVars:
      - key: BACKEND_SERVICE_USER
        value: svc-inventario
      - key: BACKEND_SERVICE_PASSWORD
        generateValue: true

services:
  - type: web
    name: identityhub-sso
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./keycloak-realm/Dockerfile
    dockerContext: ./keycloak-realm
    envVars:
      - key: PORT
        value: "8080"
      - key: KC_HOSTNAME
        value: https://identityhub-sso.onrender.com
      # Render termina HTTPS y reenvía HTTP al contenedor con encabezados X-Forwarded-*.
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: identityhub-datos
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: identityhub-datos
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: identityhub-datos
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: identityhub-datos
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: identityhub-datos
          property: password
      - key: KEYCLOAK_ADMIN
        value: admin
      # Contraseña de la consola de administración: se elige al crear el Blueprint.
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      # Contraseña del usuario de prueba ana.torres (rol admin-ti), que el realm lee al importarse.
      - key: UAT_USER_PASSWORD
        sync: false
      # Memoria para caber en 512 MB: heap y metaspace acotados, pilas y caché de código JIT
      # más pequeñas. No cambiar el recolector de basura: Keycloak ya fija G1 en JAVA_OPTS y
      # Java no arranca si se elige un segundo recolector («Multiple garbage collectors»).
      - key: JAVA_OPTS_APPEND
        value: "-Xms64m -Xmx230m -XX:MaxMetaspaceSize=150m -Xss512k -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:CICompilerCount=2"
      - fromGroup: identityhub-cliente-oidc

  # Gateway del aplicativo legacy: login con Keycloak para cualquier usuario del realm.
  - type: web
    name: identityhub-gateway
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./auth-proxy/Dockerfile
    dockerContext: ./auth-proxy
    envVars:
      - key: KEYCLOAK_URL
        value: https://identityhub-sso.onrender.com
      # El navegador va a la misma URL pública de Keycloak (sin esto se usaría localhost:8080).
      - key: KEYCLOAK_EXTERNAL_URL
        value: https://identityhub-sso.onrender.com
      - key: BACKEND_URL
        value: https://identityhub-legacy-app.onrender.com
      # Cookie de sesión solo por HTTPS.
      - key: PROXY_COOKIE_SECURE
        value: "1"
      # Clave fija para firmar las sesiones: sin ella se pierden en cada reinicio (BUG-004).
      - key: PROXY_SECRET_KEY
        generateValue: true
      - fromGroup: identityhub-cliente-oidc
      - fromGroup: identityhub-cuenta-servicio

  - type: web
    name: identityhub-legacy-app
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./legacy-app-demo/Dockerfile
    dockerContext: ./legacy-app-demo
    envVars:
      - fromGroup: identityhub-cuenta-servicio

  - type: web
    name: identityhub-inventario
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./inventory-service/Dockerfile
    dockerContext: ./inventory-service
    # Única ruta que responde sin la cuenta de servicio.
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: identityhub-datos
          property: connectionString
      - key: KEYCLOAK_URL
        value: https://identityhub-sso.onrender.com
      # Con la cuenta de servicio definida, el inventario rechaza (401) todo lo que no venga
      # de identityhub-panel. No se abre directamente.
      - fromGroup: identityhub-cuenta-inventario
      # Clave con la que se cifran los secretos de los conectores (p. ej. el client secret de
      # Entra ID) antes de guardarlos en la base. Si cambia, hay que volver a ingresarlos.
      - key: CONECTORES_CLAVE
        generateValue: true

  # Puerta de entrada al panel del inventario: la misma imagen del gateway, que exige
  # iniciar sesión en Keycloak con el rol admin-ti. Es la URL que se comparte con TI.
  - type: web
    name: identityhub-panel
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./auth-proxy/Dockerfile
    dockerContext: ./auth-proxy
    envVars:
      - key: KEYCLOAK_URL
        value: https://identityhub-sso.onrender.com
      - key: KEYCLOAK_EXTERNAL_URL
        value: https://identityhub-sso.onrender.com
      - key: BACKEND_URL
        value: https://identityhub-inventario.onrender.com
      - key: PROXY_REQUIRED_ROLE
        value: admin-ti
      - key: PROXY_COOKIE_SECURE
        value: "1"
      - key: PROXY_SECRET_KEY
        generateValue: true
      - fromGroup: identityhub-cliente-oidc
      - fromGroup: identityhub-cuenta-inventario

databases:
  # Plan gratuito: expira 30 días después de creada y se borra 14 días más tarde, sin
  # respaldos. Para uso continuo, pasarla a un plan pago (Basic) antes de esa fecha.
  - name: identityhub-datos
    plan: free
    region: virginia
    databaseName: identityhub
    user: identityhub
