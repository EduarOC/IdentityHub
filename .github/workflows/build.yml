name: Pruebas y análisis de calidad

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pruebas-y-sonar:
    name: Pruebas + SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # historial completo: SonarCloud lo usa para detectar código nuevo

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias (versiones bloqueadas con hash)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes \
            -r auth-proxy/requirements.lock \
            -r inventory-service/requirements.lock \
            -r legacy-app-demo/requirements.lock
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov --cov-config=.coveragerc --cov-report=term --cov-report=xml:coverage.xml

      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
