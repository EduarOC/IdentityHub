# Análisis de SonarCloud desde GitHub Actions (.github/workflows/build.yml).
# Reemplaza al análisis automático, que no puede importar reportes de cobertura.
sonar.projectKey=EduarOC_proyecto-de-grado
sonar.organization=identityhub
sonar.projectName=IdentityHub

sonar.python.version=3.12

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,docs/**,.scannerwork/**

# Cobertura generada por pytest-cov (ver .coveragerc)
sonar.python.coverage.reportPaths=coverage.xml
# El panel web (HTML/CSS/JS) se valida con pruebas manuales de aceptación (Issue #23),
# no con pruebas unitarias de Python, por eso no entra en la medición de cobertura.
sonar.coverage.exclusions=**/static/**,**/templates/**

# El flujo de CI espera el resultado del Quality Gate y falla si no se aprueba.
# Sin esto, GitHub Actions terminaba en verde aunque SonarCloud estuviera en rojo
# (incidentes del 28/10 y del 05/11/2026).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
